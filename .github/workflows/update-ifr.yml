name: IFR Katalog aktualisieren

on:
  schedule:
    - cron: '0 */6 * * *'  # Alle 6 Stunden
  workflow_dispatch:         # Auch manuell startbar

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install selenium

      - name: Chrome installieren
        uses: browser-actions/setup-chrome@v1

      - name: IFR-Bot ausführen
        run: python ifr_bot.py

      - name: JSON committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ifr_katalog_export.json
          git diff --staged --quiet || git commit -m "IFR Katalog automatisch aktualisiert"
          git push
